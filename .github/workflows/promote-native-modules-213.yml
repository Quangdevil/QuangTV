name: Publish verified QuangTV build 213
on:
  push:
    branches: [publish/native-modules-build213]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for signed candidate runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            STATE=$(gh api repos/$GH_REPO/actions/runs/41372297501 --jq .status)
            if [ "$STATE" = completed ]; then
              test "$(gh api repos/$GH_REPO/actions/runs/41372297501 --jq .head_sha)" = 8fb51e1a9391145b18913470b03c08c7c67f9d1d
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Signed candidate
        uses: actions/download-artifact@v4
        with:
          name: QuangTV-signed-candidate-build213
          run-id: 41372297501
          github-token: ${{ github.token }}
          path: candidate
      - name: TV and OTA evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-213
          run-id: 41372297501
          github-token: ${{ github.token }}
          path: evidence
      - name: Verify evidence and publish exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -q 'QUANGTV_PINNED_PLAYER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_NATIVE_MODULES_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_INLINE_HOME_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_HOME_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_EMBED_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_CONTROLS_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_DEMO_START_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_VTV_ORDER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_BROWSER_UI_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_PROXY_ANDROID_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_OTA_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_DIRECT_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_HISTORY_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=Media3' evidence/test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=VLC' evidence/test-result.txt
          grep -qx QUANGTV_HLS_TEST_EXIT=0 evidence/test-result.txt
          grep -qx QUANGTV_VISUAL_VERIFICATION_EXIT=0 evidence/visual-result.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV1' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV3' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_DOWNLOAD_BACKGROUND_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_DOWNLOAD_FOLDER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_BACKGROUND_SERVICE_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_MUX_PASS' evidence/browser-test-result.txt
          TAG=quangtv-v1.3.0-build213
          APK=QuangTV-v1.3.0-build213-arm64.apk
          EXPECTED=$(sha256sum "candidate/$APK" | cut -d" " -f1)
          APK_BYTES=$(stat -c %s "candidate/$APK")
          test "$APK_BYTES" -gt 29000000
          test "$APK_BYTES" -lt 35000000
          printf '%s  %s\n' "$EXPECTED" "candidate/$APK" | sha256sum -c -
          echo "QUANGTV_CANDIDATE_SHA256=$EXPECTED bytes=$APK_BYTES"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Player và ô tìm kênh giữ vị trí khi cuộn. Khôi phục logo kênh; đổi kênh và thu nhỏ giữ điều khiển ẩn. Vuốt xuống khi xem toàn màn hình để thu nhỏ.
          Menu chỉ giữ một mục IPTV. QuangTube, trình duyệt, Radio, Podcast và Private hiển thị trong vùng nội dung chung của QuangTV.
          QuangTube dùng danh sách, tìm kiếm, lịch sử tìm và đã xem bằng giao diện native, có xóa từng mục hoặc toàn bộ. Nguồn đề xuất/tìm kiếm dùng dịch vụ Mây và bộ trích xuất dự phòng.
          Trình duyệt dùng thanh địa chỉ, tab, bắt link và thư mục tải bằng giao diện native; nội dung website vẫn được dựng bằng WebView qua Mây. Giữ tải nền, mở video đã tải và vuốt xóa tệp.
          Đã kiểm tra trên giả lập Android: phát native, đổi kênh/full/thu nhỏ, ghim player/tìm kiếm, các tác vụ, bắt link, tải nền, thư mục/xóa tệp, Media3/VLC, nguồn VTV1/VTV3 và OTA.
          Cài đè bằng cùng chữ ký, giữ dữ liệu. APK ARM64 khoảng 32 MB. Phát YouTube trực tiếp có thể bị máy chủ YouTube yêu cầu xác minh bot; chưa xác nhận hoạt động trên mọi mạng.
          NOTES
          gh release create "$TAG" "candidate/$APK" --target 8fb51e1a9391145b18913470b03c08c7c67f9d1d --draft --title 'QuangTV 1.3.0 · Giao diện native Mây (build 213)' --notes-file "$RUNNER_TEMP/notes.md"
          gh release download "$TAG" --pattern "$APK" --dir "$RUNNER_TEMP/verified"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/verified/$APK" | sha256sum -c -
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" "$TAG" "$APK" "$EXPECTED" "$APK_BYTES" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: r=json.load(f)
          assert r['tag_name']==sys.argv[2] and not r['draft'] and not r['prerelease']
          a=[a for a in r['assets'] if a['name']==sys.argv[3]]
          assert len(a)==1 and a[0]['digest']=='sha256:'+sys.argv[4] and a[0]['size']==int(sys.argv[5])
          print('QUANGTV_OTA_PROMOTION_PASS tag='+r['tag_name'])
          PY

name: Diagnose VTV sources
on:
  push:
    branches: [diagnose/vtv-sources]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe configured VTV manifests and media
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, urllib.error
          sources = [
              ('VTV1 playlist current', 'https://vips-livecdn.fptplay.net/live/media/vtv1/live247-hls-avc/index.m3u8'),
              ('VTV2 playlist current', 'https://vips-livecdn.fptplay.net/live/media/vtv2/live247-hls-avc/index.m3u8'),
              ('VTV3 playlist current', 'https://vips-livecdn.fptplay.net/live/media/vtv3/live247-hls-avc/index.m3u8'),
              ('VTV1 FPT', 'https://live.fptplay53.net/live/media/vtv1/live247-hls-avc/index.m3u8'),
              ('VTV1 VTVgo', 'https://vtvgolive-failover.vtvdigital.vn/vtvgo/vtv1-manifest.m3u8'),
              ('VTV1 NetHub', 'https://ott1.nethubtv.vn/live/vtv1/playlist.m3u8'),
              ('VTV2 FPT', 'https://live.fptplay53.net/live/media/vtv2/live247-hls-avc/index.m3u8'),
              ('VTV2 VTVgo', 'https://vtvgolive-failover.vtvdigital.vn/vtvgo/vtv2-manifest.m3u8'),
              ('VTV3 FPT', 'https://live.fptplay53.net/live/media/vtv3/live247-hls-avc/index.m3u8'),
              ('VTV3 VTVgo', 'https://vtvgolive-failover.vtvdigital.vn/vtvgo/vtv3-manifest.m3u8'),
          ]
          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'QuangTV/1.3 Android Media3', 'Range':'bytes=0-65535'})
              with urllib.request.urlopen(req, timeout=12) as r:
                  return r.status, r.headers.get('Content-Type',''), r.geturl(), r.read(65536)
          for name, url in sources:
              try:
                  code, content_type, final, data = get(url)
                  print(name, 'manifest', code, content_type, 'hls=', data.startswith(b'#EXTM3U'), flush=True)
                  if data.startswith(b'#EXTM3U'):
                      lines = data.decode('utf-8', 'replace').splitlines()
                      children = [x.strip() for x in lines if x.strip() and not x.startswith('#')]
                      if children:
                          code2, type2, _, data2 = get(urllib.parse.urljoin(final, children[0]))
                          print(name, 'child', code2, type2, 'bytes=', len(data2), 'child_is_hls=', data2.startswith(b'#EXTM3U'), flush=True)
              except Exception as e:
                  print(name, 'ERROR', type(e).__name__, str(e)[:200], flush=True)
          PY

name: Publish verified QuangTV YouTube and May update
on:
  push:
    branches: [publish/ui-build193]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download unchanged signed build 193
        uses: actions/download-artifact@v4
        with:
          name: QuangTV-signed-candidate-build193
          run-id: 40661959853
          github-token: ${{ github.token }}
          path: candidate
      - name: Download Android evidence from matching app source
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-195
          run-id: 40666782257
          github-token: ${{ github.token }}
          path: evidence
      - name: Download focused browser evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-196
          run-id: 40669124068
          github-token: ${{ github.token }}
          path: browser-evidence
      - name: Verify functional evidence and publish exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -q QUANGTV_MAY_EMBED_PASS browser-evidence/browser-test-result.txt
          grep -q QUANGTV_MAY_CONTROLS_PASS browser-evidence/browser-test-result.txt
          grep -q QUANGTV_BROWSER_UI_PASS browser-evidence/browser-test-result.txt
          grep -q QUANGTV_PROXY_ANDROID_PASS browser-evidence/browser-test-result.txt
          grep -q QUANGTV_YOUTUBE_DIRECT_PASS evidence/ota-test-result.txt
          grep -q QUANGTV_YOUTUBE_HISTORY_PASS evidence/ota-test-result.txt
          grep -q QUANGTV_OTA_PASS evidence/ota-test-result.txt
          grep -qx QUANGTV_HLS_TEST_EXIT=0 evidence/test-result.txt
          grep -qx QUANGTV_VISUAL_VERIFICATION_EXIT=0 evidence/visual-result.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV1' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV3' evidence/vtv-live-visual.txt
          TAG=quangtv-v1.3.0-build193
          APK=QuangTV-v1.3.0-build193-arm64.apk
          EXPECTED=6c21729773ea3811e88aa438d1d96447de44acb75cdc4099fe03258c6f232953
          printf '%s  %s\n' "$EXPECTED" "candidate/$APK" | sha256sum -c -
          test "$(stat -c %s "candidate/$APK")" = 31470445
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          YouTube mở thẳng QuangTube bên trong QuangTV, giữ cấu trúc IPTV → QuangTV → QuangTube.
          Lịch sử tìm kiếm và video đã xem lưu trên máy, xóa từng mục hoặc toàn bộ, không cần tài khoản ứng dụng.
          Trình duyệt nhúng Mây theo luồng riêng với proxy IPTV; video ngang có nút hiện khi chạm, phát/dừng, âm lượng, thanh tua và chạm đúp hai bên ±10 giây.
          Đã kiểm tra thao tác Mây, proxy, OTA, Media3/VLC và hình ảnh chuyển động VTV1/VTV3 trên Android giả lập.
          YouTube có thể yêu cầu xác minh đăng nhập theo mạng; kiểm tra phát video trực tiếp trên IP máy chủ CI bị chặn xác minh bot.
          APK 31.470.445 byte, cùng chữ ký phát hành, cài đè để giữ dữ liệu. Bản 185 vẫn được giữ lại để khôi phục.
          NOTES
          gh release create "$TAG" "candidate/$APK" --target 87b8161c857763d513205a1a52f8c2dcc45c7fb9 --draft --title 'QuangTV 1.3.0 · YouTube và Mây (build 193)' --notes-file "$RUNNER_TEMP/notes.md"
          gh release download "$TAG" --pattern "$APK" --dir "$RUNNER_TEMP/verified"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/verified/$APK" | sha256sum -c -
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" "$TAG" "$APK" "$EXPECTED" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: r=json.load(f)
          assert r['tag_name']==sys.argv[2] and not r['draft'] and not r['prerelease']
          a=[a for a in r['assets'] if a['name']==sys.argv[3]]
          assert len(a)==1 and a[0]['digest']=='sha256:'+sys.argv[4] and a[0]['size']==31470445
          print('QUANGTV_OTA_PROMOTION_PASS tag='+r['tag_name'])
          PY

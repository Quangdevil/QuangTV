name: Publish verified QuangTV build 215
on:
  push:
    branches: [publish/social-downloads-build215]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for signed candidate runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            STATE=$(gh api repos/$GH_REPO/actions/runs/41867014018 --jq .status)
            if [ "$STATE" = completed ]; then
              test "$(gh api repos/$GH_REPO/actions/runs/41867014018 --jq .head_sha)" = 73ecca3dc67c06c2d99f75b325bc7f3d8a54f697
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Wait for corrected keyboard viewport and bulk deletion QA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            STATE=$(gh api repos/$GH_REPO/actions/runs/41868899371 --jq .status)
            if [ "$STATE" = completed ]; then
              test "$(gh api repos/$GH_REPO/actions/runs/41868899371 --jq .head_sha)" = 3790f8e3f02ccba11246a49cbd90cdef32993ed3
              test "$(gh api repos/$GH_REPO/actions/runs/41868899371 --jq .conclusion)" = success
              gh api repos/$GH_REPO/compare/73ecca3dc67c06c2d99f75b325bc7f3d8a54f697...3790f8e3f02ccba11246a49cbd90cdef32993ed3 > "$RUNNER_TEMP/qa-diff.json"
              python3 - "$RUNNER_TEMP/qa-diff.json" <<'PY'
              import json,sys
              j=json.load(open(sys.argv[1]))
              allowed={'.github/workflows/compile-native-modules.yml','scripts/test_browser.sh','tests/browser_test.dart'}
              assert j['status']=='ahead' and set(f['filename'] for f in j['files'])<=allowed
              print('QUANGTV_QA_PRODUCTION_SOURCE_IDENTICAL_PASS')
              PY
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Signed candidate
        uses: actions/download-artifact@v4
        with:
          name: QuangTV-signed-candidate-build215
          run-id: 41867014018
          github-token: ${{ github.token }}
          path: candidate
      - name: TV and OTA evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-215
          run-id: 41867014018
          github-token: ${{ github.token }}
          path: evidence
      - name: Corrected viewport and bulk deletion evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-
          run-id: 41868899371
          github-token: ${{ github.token }}
          path: corrected-evidence
      - name: Verify evidence and publish exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -q 'QUANGTV_PINNED_PLAYER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_NATIVE_MODULES_PASS' corrected-evidence/browser-test-result.txt
          grep -q 'QUANGTV_DOWNLOAD_BULK_PASS' corrected-evidence/browser-test-result.txt
          grep -q 'QUANGTV_SOCIAL_SHARE_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_SOCIAL_LIVE_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_INLINE_HOME_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_HOME_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_EMBED_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_CONTROLS_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_DEMO_START_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_VTV_ORDER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_BROWSER_UI_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_PROXY_ANDROID_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_OTA_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_DIRECT_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_HISTORY_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=Media3' evidence/test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=VLC' evidence/test-result.txt
          grep -qx QUANGTV_HLS_TEST_EXIT=0 evidence/test-result.txt
          grep -qx QUANGTV_VISUAL_VERIFICATION_EXIT=0 evidence/visual-result.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV1' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV3' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_DOWNLOAD_BACKGROUND_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_DOWNLOAD_FOLDER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_BACKGROUND_SERVICE_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_MUX_PASS' evidence/browser-test-result.txt
          TAG=quangtv-v1.3.0-build215
          APK=QuangTV-v1.3.0-build215-arm64.apk
          EXPECTED=$(sha256sum "candidate/$APK" | cut -d" " -f1)
          APK_BYTES=$(stat -c %s "candidate/$APK")
          test "$APK_BYTES" -gt 29000000
          test "$APK_BYTES" -lt 35000000
          printf '%s  %s\n' "$EXPECTED" "candidate/$APK" | sha256sum -c -
          echo "QUANGTV_CANDIDATE_SHA256=$EXPECTED bytes=$APK_BYTES"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Thêm mục Tải video cho link chia sẻ Facebook, TikTok và Douyin; có thể nhận nguyên đoạn chia sẻ qua Chia sẻ → QuangTV.
          Bộ đọc Douyin giữ phiên ẩn danh để lấy dữ liệu trang chia sẻ và ưu tiên biến thể phát công khai. Link mẫu đã tải thành MP4 và mở phát trên Android trong bài kiểm thử bắt buộc. Không xóa chữ hoặc logo đã đóng vào hình ảnh gốc.
          Trình duyệt có thanh địa chỉ phía dưới, nút Bắt video luôn hiển thị và nguồn nhận diện trong trình duyệt trực tiếp. Chặn trường hợp chuyển sang video đề xuất khác để tránh tải nhầm.
          Thư mục Đã tải có mở xem, gạt xóa tệp thật, xóa toàn bộ có xác nhận, tách lượt đang tải/lỗi và thử lại.
          Giữ IPTV, VTV, Private, Radio, Podcast, QuangTube, proxy và OTA. Kiểm thử bắt buộc gồm video thật VTV1/VTV3, Media3/VLC, nguồn video Douyin, tải nền, mở tệp, xóa toàn bộ và OTA.
          Cài đè bằng cùng chữ ký, giữ dữ liệu. Facebook/TikTok có bộ đọc nguồn nhưng không cam kết mọi link đều tải được; nội dung cần đăng nhập/xác minh có thể không lấy được. YouTube trực tiếp trên mạng CI vẫn có thể yêu cầu xác minh bot.
          NOTES
          gh release create "$TAG" "candidate/$APK" --target 73ecca3dc67c06c2d99f75b325bc7f3d8a54f697 --draft --title 'QuangTV 1.3.0 · Tải video & trình duyệt native (build 215)' --notes-file "$RUNNER_TEMP/notes.md"
          gh release download "$TAG" --pattern "$APK" --dir "$RUNNER_TEMP/verified"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/verified/$APK" | sha256sum -c -
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" "$TAG" "$APK" "$EXPECTED" "$APK_BYTES" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: r=json.load(f)
          assert r['tag_name']==sys.argv[2] and not r['draft'] and not r['prerelease']
          a=[a for a in r['assets'] if a['name']==sys.argv[3]]
          assert len(a)==1 and a[0]['digest']=='sha256:'+sys.argv[4] and a[0]['size']==int(sys.argv[5])
          print('QUANGTV_OTA_PROMOTION_PASS tag='+r['tag_name'])
          PY

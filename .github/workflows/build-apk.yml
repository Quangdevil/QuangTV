name: Build QuangTV APK
on:
  push:
    branches: [main, fix/native-playback-validation]
    paths-ignore: ['cloudflare/**']
  workflow_dispatch:
    inputs:
      ui_only_release:
        description: 'UI-only release: analyze/build/sign without emulator playback tests'
        type: boolean
        default: false
concurrency:
  group: quangtv-android-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout QuangTV build recipe
        uses: actions/checkout@v4
      - name: Checkout pinned MIT TV Viewer source
        uses: actions/checkout@v4
        with:
          repository: tv-viewer-app/tv_viewer
          ref: 188df516a8acb4a2fda0d65fed8b6199c734603f
          path: upstream
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test authenticated proxy relay
        run: python3 cloudflare/test_native_websocket.py
      - name: Test Cloudflare reader security and rewriting
        run: node --test cloudflare/worker.test.mjs
      - name: Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Apply QuangTV UI integration
        run: python3 scripts/patch_quangtv.py
      - name: Flutter dependencies
        working-directory: upstream/flutter_app
        run: flutter pub get
      - name: Isolate VLC native registration per Flutter engine
        run: |
          python3 scripts/patch_vlc_engine.py
          cd upstream/flutter_app
          flutter pub get
      - name: Analyze QuangTV Dart code
        working-directory: upstream/flutter_app
        run: flutter analyze lib/screens/quang_network.dart lib/screens/quang_discover_screen.dart lib/screens/quang_native_player.dart lib/screens/quang_audio_screen.dart lib/screens/quang_update_screen.dart lib/screens/quang_browser_screen.dart lib/screens/quang_proxy_screen.dart integration_test/browser_test.dart
      - name: Restore permanent QuangTV release keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANGTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUANGTV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.QUANGTV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUANGTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing QUANGTV_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing QUANGTV_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing QUANGTV_KEY_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing QUANGTV_KEY_ALIAS secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upstream/flutter_app/android/app/quangtv-release.jks
          {
            echo 'storeFile=quangtv-release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > upstream/flutter_app/android/key.properties
          chmod 600 upstream/flutter_app/android/key.properties upstream/flutter_app/android/app/quangtv-release.jks
      - name: Compile signed QuangTV release APK
        if: github.ref == 'refs/heads/main'
        working-directory: upstream/flutter_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name=1.3.0 --build-number=${{ github.run_number }}
      - name: Generate deterministic HLS fixture
        if: inputs.ui_only_release != true && !contains(github.event.head_commit.message, '[ui-only-release]')
        run: |
          timeout 60s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq || true
          timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y ffmpeg python3-pil
          mkdir -p /tmp/quangtv-hls
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440 -t 60 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 48 -c:a aac -f hls -hls_time 2 -hls_list_size 0 /tmp/quangtv-hls/index.m3u8
          ffmpeg -hide_banner -loglevel error -i /tmp/quangtv-hls/index.m3u8 -c copy /tmp/quangtv-hls/fixture.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/quangtv-hls/fixture.mp4 -c:v copy -an -movflags +faststart /tmp/quangtv-hls/video-only.mp4
          ffmpeg -hide_banner -loglevel error -i /tmp/quangtv-hls/fixture.mp4 -c:a copy -vn -movflags +faststart /tmp/quangtv-hls/audio-only.m4a
          echo '<meta name="viewport" content="width=device-width"><h1>Browser fixture</h1><img hidden src="https://doubleclick.net/quangtv-fixture.png"><video controls preload="none" src="fixture.mp4"></video><script>fetch("fixture.mp4?resource=1").then(r=>r.arrayBuffer())</script>' > /tmp/quangtv-hls/browser.html
          python3 scripts/serve_test_media.py >/tmp/quangtv-hls-server.log 2>&1 &
          python3 scripts/serve_test_proxy.py >/tmp/quangtv-proxy-server.log 2>&1 &
      - name: Enable KVM for Android playback tests
        if: inputs.ui_only_release != true && !contains(github.event.head_commit.message, '[ui-only-release]')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native Media3 and VLC playback on Android
        if: ${{ !contains(github.event.head_commit.message, '[browser-release]') && inputs.ui_only_release != true && !contains(github.event.head_commit.message, '[ui-only-release]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15261927
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test_native_hls.sh
      - name: Test browser discovery, keyboard, downloads and native playback
        if: contains(github.event.head_commit.message, '[browser-release]')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15261927
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -show-kernel -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -feature -Vulkan,-HardwareDecoder -memory 2048
          script: bash scripts/test_browser.sh
      - name: Retain playback logs even on failure
        if: always() && inputs.ui_only_release != true && !contains(github.event.head_commit.message, '[ui-only-release]')
        uses: actions/upload-artifact@v4
        with:
          name: native-playback-evidence-${{ github.run_number }}
          overwrite: true
          path: playback-evidence/
          if-no-files-found: warn
      - name: Name APK by version and build
        if: github.ref == 'refs/heads/main'
        run: cp upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "QuangTV-v1.3.0-build${{ github.run_number }}-arm64.apk"
      - name: Verify signed release APK
        if: github.ref == 'refs/heads/main'
        run: |
          test -s upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          jarsigner -verify upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          python3 scripts/verify_release_apk.py upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: QuangTV-v1.3.0-build${{ github.run_number }}-arm64
          path: QuangTV-v1.3.0-build${{ github.run_number }}-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.3.0"
          TAG="quangtv-v${VERSION}-build${{ github.run_number }}"
          APK="QuangTV-v${VERSION}-build${{ github.run_number }}-arm64.apk"
          gh release create "$TAG" "$APK" --title "QuangTV v${VERSION} (build ${{ github.run_number }})" --notes "QuangTV signed Android APK. Install over previous QuangTV releases without uninstalling." --latest

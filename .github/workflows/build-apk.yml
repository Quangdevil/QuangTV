name: Build QuangTV APK
on:
  push:
    branches: [main, fix/native-playback-validation]
    paths-ignore: ['cloudflare/**']
  workflow_dispatch:
concurrency:
  group: quangtv-android-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Allocate monotonic version above installed rollback build 177
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_ENV"
      - name: Checkout QuangTV build recipe
        uses: actions/checkout@v4
      - name: Checkout pinned MIT TV Viewer source
        uses: actions/checkout@v4
        with:
          repository: tv-viewer-app/tv_viewer
          ref: 188df516a8acb4a2fda0d65fed8b6199c734603f
          path: upstream
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test release certificate verification
        run: python3 -m unittest discover -s tests -p test_signer_certificate.py
      - name: Test authenticated proxy relay
        run: python3 cloudflare/test_native_websocket.py
      - name: Test Cloudflare reader security and rewriting
        run: node --test cloudflare/worker.test.mjs
      - name: Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Apply QuangTV UI integration
        run: python3 scripts/patch_quangtv.py
      - name: Restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: quangtv-gradle-linux-agp892-desugar215-v1
      - name: Flutter dependencies
        working-directory: upstream/flutter_app
        run: flutter pub get
      - name: Isolate VLC native registration per Flutter engine
        run: |
          python3 scripts/patch_vlc_engine.py
          cd upstream/flutter_app
          flutter pub get
      - name: Analyze QuangTV Dart code
        working-directory: upstream/flutter_app
        run: flutter analyze lib/screens/quang_vtv_source.dart lib/screens/quang_network.dart lib/screens/quang_discover_screen.dart lib/screens/quang_native_player.dart lib/screens/quang_audio_screen.dart lib/screens/quang_update_screen.dart lib/screens/quang_browser_screen.dart lib/screens/quang_proxy_screen.dart integration_test/browser_test.dart
      - name: Test fresh anonymous VTVgo sources
        working-directory: upstream/flutter_app
        run: flutter test test/quang_vtv_source_test.dart
      - name: Cache pinned FFmpeg test tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quangtv-ffmpeg-8.1/ffmpeg.tar.xz
          key: ffmpeg-linux64-d113aa5b57ab0dcf
      - name: Install image verification dependency
        run: |
          python3 -m pip install --only-binary=:all: Pillow==11.3.0
      - name: Install verified FFmpeg test tools
        run: bash scripts/setup_test_ffmpeg.sh
      - name: Generate and decode deterministic HLS fixture
        run: bash scripts/generate_test_media.sh
      - name: Start deterministic media servers
        run: |
          python3 scripts/serve_test_media.py >/tmp/quangtv-hls-server.log 2>&1 &
          python3 scripts/serve_test_proxy.py >/tmp/quangtv-proxy-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/browser.html > /dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::Media fixture server did not become ready'; exit 1
      - name: Restore permanent QuangTV release keystore
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANGTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QUANGTV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.QUANGTV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUANGTV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing QUANGTV_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing QUANGTV_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing QUANGTV_KEY_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing QUANGTV_KEY_ALIAS secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upstream/flutter_app/android/app/quangtv-release.jks
          {
            echo 'storeFile=quangtv-release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > upstream/flutter_app/android/key.properties
          chmod 600 upstream/flutter_app/android/key.properties upstream/flutter_app/android/app/quangtv-release.jks
      - name: Compile signed QuangTV release APK
        if: github.ref == 'refs/heads/main'
        working-directory: upstream/flutter_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name=1.3.0 --build-number=${{ env.BUILD_NUMBER }}
      - name: Name APK by version and build
        if: github.ref == 'refs/heads/main'
        run: cp upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64.apk"
      - name: Verify signed release APK
        id: verify_apk
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.QUANGTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QUANGTV_KEY_ALIAS }}
        run: |
          test -s upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          bash scripts/verify_android_signature.sh "QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64.apk" "${{ env.BUILD_NUMBER }}"
          python3 scripts/verify_release_apk.py upstream/flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Retain signed candidate before Android runtime QA
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: QuangTV-signed-candidate-build${{ env.BUILD_NUMBER }}
          path: QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for Android playback tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Precompile R8-minified Android integration APK before Emulator
        working-directory: upstream/flutter_app
        run: |
          flutter build apk --debug --target-platform android-x64 --target integration_test/browser_test.dart
          python3 ../../scripts/verify_vlc_dex.py build/app/outputs/flutter-apk/app-debug.apk
          cd android
          ./gradlew --stop
      - name: Save compiled dependency cache before runtime tests
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: quangtv-gradle-linux-agp892-desugar215-v1
      - name: Test browser, native playback, controls and OTA on Android
        id: android_tests
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15261927
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          pre-emulator-launch-script: bash scripts/setup_ci_graphics.sh
          emulator-options: -no-window -show-kernel -no-snapshot -noaudio -no-boot-anim -gpu host -verbose -feature -Vulkan,-HardwareDecoder -memory 2048 -cores 2
          script: bash scripts/test_android.sh
      - name: Retain playback logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-playback-evidence-${{ env.BUILD_NUMBER }}
          overwrite: true
          path: playback-evidence/
          if-no-files-found: warn
      - name: Publish VTV diagnostic prerelease
        if: always() && github.ref == 'refs/heads/main' && steps.verify_apk.outcome == 'success' && steps.android_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'QUANGTV_VTV_FAILOVER_PASS media3Rejected=true vlcAdvanced=true' playback-evidence/test-result.txt
          grep -qx 'QUANGTV_HLS_TEST_EXIT=0' playback-evidence/test-result.txt
          grep -q 'QUANGTV_RENDER_PASS engine=Media3' playback-evidence/visual-result.txt
          grep -q 'QUANGTV_RENDER_PASS engine=VLC' playback-evidence/visual-result.txt
          grep -q 'QUANGTV_ROTATION_PASS engine=Media3' playback-evidence/visual-result.txt
          grep -q 'QUANGTV_ROTATION_PASS engine=VLC' playback-evidence/visual-result.txt
          grep -qx 'QUANGTV_VISUAL_VERIFICATION_EXIT=0' playback-evidence/visual-result.txt
          grep -q 'QUANGTV_VTV_LIVE_PASS channel=VTV1' playback-evidence/vtv-live-result.txt
          grep -q 'QUANGTV_VTV_LIVE_PASS channel=VTV3' playback-evidence/vtv-live-result.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV1' playback-evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV3' playback-evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_YOUTUBE_DIRECT_PASS' playback-evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_HISTORY_PASS' playback-evidence/ota-test-result.txt
          grep -q 'QUANGTV_MAY_EMBED_PASS' playback-evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_CONTROLS_PASS' playback-evidence/browser-test-result.txt
          APK="QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64.apk"
          TAG="quangtv-v1.3.0-vtv-test-build${{ env.BUILD_NUMBER }}"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --latest=false --title "QuangTV VTV thử nghiệm (build ${{ env.BUILD_NUMBER }})" --notes "Bản thử nghiệm ký bằng khóa chính thức: Media3/VLC và chuyển nguồn VTV đã kiểm tra bằng luồng HLS mẫu trên giả lập. VTV1 và VTV3 thực tế đã giải mã và phát tiến hơn 5 giây trên giả lập bằng nguồn mới từ API VTVgo miễn phí. Kiểm thử YouTube sẽ xử lý sau. Bản này không phải OTA chính thức."
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64
          path: QuangTV-v1.3.0-build${{ env.BUILD_NUMBER }}-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="1.3.0"
          TAG="quangtv-v${VERSION}-build${{ env.BUILD_NUMBER }}"
          APK="QuangTV-v${VERSION}-build${{ env.BUILD_NUMBER }}-arm64.apk"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --draft --title "QuangTV v${VERSION} (build ${{ env.BUILD_NUMBER }})" --notes "Signed compact ARM64 APK. VLC JNI classes verified in minified DEX and R8-minified Android Media3/VLC playback, controls, browser and OTA emulator tests passed. Direct YouTube entry and local viewing history restored. Install over previous releases without uninstalling."
          mkdir -p "$RUNNER_TEMP/ota-download"
          gh release download "$TAG" --pattern "$APK" --dir "$RUNNER_TEMP/ota-download"
          cmp "$APK" "$RUNNER_TEMP/ota-download/$APK"
          gh release edit "$TAG" --draft=false --latest
          python3 scripts/verify_ota_release.py "$TAG" "$APK"

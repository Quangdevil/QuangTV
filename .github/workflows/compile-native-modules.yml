name: Verify social downloads and native browser
on:
  push:
    branches: [qa/social-downloads]
permissions:
  contents: read
jobs:
  home:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout QuangTV build recipe
        uses: actions/checkout@v4
      - name: Checkout pinned MIT TV Viewer source
        uses: actions/checkout@v4
        with:
          repository: tv-viewer-app/tv_viewer
          ref: 188df516a8acb4a2fda0d65fed8b6199c734603f
          path: upstream
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Apply QuangTV UI integration
        run: python3 scripts/patch_quangtv.py
      - name: Restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: quangtv-gradle-linux-agp892-desugar215-v1
      - name: Flutter dependencies
        working-directory: upstream/flutter_app
        run: flutter pub get
      - name: Isolate VLC native registration per Flutter engine
        run: |
          python3 scripts/patch_vlc_engine.py
          cd upstream/flutter_app
          flutter pub get
      - name: Analyze QuangTV Dart code
        working-directory: upstream/flutter_app
        run: flutter analyze lib/screens/quang_social_downloads.dart lib/screens/quang_native_browser.dart lib/screens/quang_native_tube.dart lib/screens/quang_may_shell.dart lib/screens/quang_vtv_source.dart lib/screens/quang_network.dart lib/screens/quang_discover_screen.dart lib/screens/quang_native_player.dart lib/screens/quang_audio_screen.dart lib/screens/quang_update_screen.dart lib/screens/quang_browser_screen.dart lib/screens/quang_proxy_screen.dart integration_test/browser_test.dart
      - name: Cache pinned FFmpeg test tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quangtv-ffmpeg-8.1/ffmpeg.tar.xz
          key: ffmpeg-linux64-d113aa5b57ab0dcf
      - name: Install image verification dependency
        run: |
          python3 -m pip install --only-binary=:all: Pillow==11.3.0
      - name: Install verified FFmpeg test tools
        run: bash scripts/setup_test_ffmpeg.sh
      - name: Generate and decode deterministic HLS fixture
        run: bash scripts/generate_test_media.sh
      - name: Start deterministic media servers
        run: |
          python3 scripts/serve_test_media.py >/tmp/quangtv-hls-server.log 2>&1 &
          python3 scripts/serve_test_proxy.py >/tmp/quangtv-proxy-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/browser.html > /dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::Media fixture server did not become ready'; exit 1
      - name: Enable KVM for Android playback tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Precompile R8-minified Android integration APK before Emulator
        working-directory: upstream/flutter_app
        run: |
          flutter build apk --debug --target-platform android-x64 --target integration_test/browser_test.dart
          python3 ../../scripts/verify_vlc_dex.py build/app/outputs/flutter-apk/app-debug.apk
          cd android
          ./gradlew --stop
      - name: Retain native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: native-modules-debug
          overwrite: true
          path: upstream/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Test browser, native playback, controls and OTA on Android
        id: android_tests
        env:
          QUANGTV_TEST_NAME: 'Douyin shared public clip downloads and opens a real local video'
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          GALLIUM_DRIVER: llvmpipe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15261927
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          pre-emulator-launch-script: bash scripts/setup_ci_graphics.sh
          emulator-options: -no-window -show-kernel -no-snapshot -noaudio -no-boot-anim -gpu host -verbose -feature -Vulkan,-HardwareDecoder -memory 1536 -cores 2
          script: |
            adb root
            adb wait-for-device
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell pm disable --user 0 com.google.android.gms/.fonts.provider.FontsProvider
            adb shell am force-stop com.google.android.gms
            bash scripts/test_browser.sh
      - name: Retain playback logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-playback-evidence-${{ env.BUILD_NUMBER }}
          overwrite: true
          path: playback-evidence/
          if-no-files-found: warn

name: Publish verified QuangTV build 197
on:
  push:
    branches: [publish/ui-build197]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Signed candidate
        uses: actions/download-artifact@v4
        with:
          name: QuangTV-signed-candidate-build197
          run-id: 40897657712
          github-token: ${{ github.token }}
          path: candidate
      - name: TV and OTA evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-197
          run-id: 40897657712
          github-token: ${{ github.token }}
          path: evidence
      - name: Browser evidence
        uses: actions/download-artifact@v4
        with:
          name: native-playback-evidence-200
          run-id: 40906390791
          github-token: ${{ github.token }}
          path: browser-evidence
      - name: Verify evidence and publish exact APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -q 'QUANGTV_MAY_EMBED_PASS' browser-evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_CONTROLS_PASS' browser-evidence/browser-test-result.txt
          grep -q 'QUANGTV_MAY_DEMO_START_PASS' browser-evidence/browser-test-result.txt
          grep -q 'QUANGTV_VTV_ORDER_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_BROWSER_UI_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_PROXY_ANDROID_PASS' evidence/browser-test-result.txt
          grep -q 'QUANGTV_OTA_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_DIRECT_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_YOUTUBE_HISTORY_PASS' evidence/ota-test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=Media3' evidence/test-result.txt
          grep -q 'QUANGTV_ROTATION_TAP_ONLY_PASS engine=VLC' evidence/test-result.txt
          grep -qx QUANGTV_HLS_TEST_EXIT=0 evidence/test-result.txt
          grep -qx QUANGTV_VISUAL_VERIFICATION_EXIT=0 evidence/visual-result.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV1' evidence/vtv-live-visual.txt
          grep -q 'QUANGTV_VTV_RENDER_PASS channel=VTV3' evidence/vtv-live-visual.txt
          TAG=quangtv-v1.3.0-build197
          APK=QuangTV-v1.3.0-build197-arm64.apk
          EXPECTED=2188dc579fecf64e56feaa0bf1427951bddaa3471eb93bbd60661eeef9469008
          printf '%s  %s\n' "$EXPECTED" "candidate/$APK" | sha256sum -c -
          test "$(stat -c %s "candidate/$APK")" = 31472353
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          Trình duyệt tiếp tục nhúng web Mây, cho phép preview tắt tiếng phát như trên web và hỗ trợ một chạm để bắt đầu video demo.
          VTV/Private: xoay ngang vào toàn màn hình với thanh điều khiển ẩn. Chạm mới hiện; tự ẩn sau 3 giây. Giữ nguyên nguồn phát và cấu hình proxy.
          Danh sách TV ưu tiên VTV1, VTV2, VTV3… theo số; giữ thứ tự các kênh còn lại.
          Đã kiểm tra thao tác Mây, thứ tự kênh, Media3/VLC, xoay/ẩn/hiện điều khiển, VTV1/VTV3 có hình chuyển động và OTA trên Android giả lập.
          Cài đè lên bản 193 bằng cùng chữ ký để giữ dữ liệu. Kiểm tra phát YouTube trực tiếp trên IP CI vẫn bị yêu cầu xác minh bot; chức năng YouTube không thay đổi trong đợt này.
          NOTES
          gh release create "$TAG" "candidate/$APK" --target 5f7fdb17cd7c6c382956ff24d3946f201476844d --draft --title 'QuangTV 1.3.0 · Mây và điều khiển TV (build 197)' --notes-file "$RUNNER_TEMP/notes.md"
          gh release download "$TAG" --pattern "$APK" --dir "$RUNNER_TEMP/verified"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/verified/$APK" | sha256sum -c -
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest.json"
          python3 - "$RUNNER_TEMP/latest.json" "$TAG" "$APK" "$EXPECTED" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: r=json.load(f)
          assert r['tag_name']==sys.argv[2] and not r['draft'] and not r['prerelease']
          a=[a for a in r['assets'] if a['name']==sys.argv[3]]
          assert len(a)==1 and a[0]['digest']=='sha256:'+sys.argv[4] and a[0]['size']==31472353
          print('QUANGTV_OTA_PROMOTION_PASS tag='+r['tag_name'])
          PY

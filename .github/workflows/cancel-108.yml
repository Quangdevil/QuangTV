name: Cancel superseded rollback
on:
  push:
    branches: [control/cancel-build108]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel build 108 per corrected user request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/40468173506/cancel"

name: Cancel obsolete restoration attempts
on:
  push:
    branches: [control/cancel-build108]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in 40476369392 40476449263; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || echo "Run $id already ended"
          done
